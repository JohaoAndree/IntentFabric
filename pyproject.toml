[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "intentfabric"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
ssh = ["netmiko>=4.8,<5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
